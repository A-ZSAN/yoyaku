<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
予約ページ
</title>


<link
rel="stylesheet"
href="css/style.css"
>


</head>


<body>


<header>

<div class="header-inner">

<h1>
予約
</h1>

</div>

</header>



<main>


<section>


<h2>
ご利用日を選択
</h2>


<div id="calendar">

</div>


<input
type="hidden"
id="useDate"
>


</section>



<section>


<h2>
予約情報
</h2>


<label>

会社名

<input
type="text"
id="company"
>

</label>



<label>

お名前

<input
type="text"
id="name"
required
>

</label>



<label>

電話番号

<input
type="tel"
id="phone"
required
>

</label>



<label>

メールアドレス

<input
type="email"
id="mail"
>

</label>



<label>

人数

<select
id="people"
>

<option value="1">
1名
</option>

<option value="2">
2名
</option>

<option value="3">
3名
</option>

<option value="4">
4名
</option>

<option value="5">
5名
</option>

<option value="6">
6名
</option>

<option value="7">
7名
</option>

<option value="8">
8名
</option>

<option value="9">
9名
</option>

<option value="10">
10名
</option>

</select>

</label>



<label>

備考

<textarea
id="memo"
></textarea>

</label>


</section>



<section>


<h2>
料金
</h2>


<div id="totalPrice">

人数を選択してください

</div>


</section>



<section>


<button
id="reserveButton"
>

予約する

</button>


</section>



</main>



<script src="js/config.js"></script>

<script src="js/reservation.js"></script>


</body>

</html>
