<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .reservation-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .cancel-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 12px;
      margin-right: 8px;
    }
    .edit-btn {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 12px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 12px;
      max-width: 400px;
      width: 90%;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>マイページ</h1>
  </div>
</header>

<main>
  <!-- 検索エリア -->
  <section class="reservation-section">
    <h2>予約を確認する</h2>
    <div class="search-area">
      <div class="form-group">
        <label for="phoneSearch">電話番号を入力</label>
        <input type="tel" id="phoneSearch" placeholder="090-1234-5678">
      </div>
      <button onclick="searchReservations()" class="reserve-btn">検索する</button>
    </div>
  </section>

  <!-- 結果表示エリア -->
  <section class="reservation-section">
    <h2>予約一覧</h2>
    <div id="resultArea">
      <p>電話番号を入力して検索してください。</p>
    </div>
  </section>
</main>

<!-- 変更用モーダル -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>予約を変更する</h3>
    <div style="margin: 20px 0;">
      <div class="form-group">
        <label>利用日</label>
        <input type="date" id="editDate">
      </div>
      <div class="form-group">
        <label>人数</label>
        <select id="editPeople">
          <option value="1">1名</option>
          <option value="2">2名</option>
          <option value="3">3名</option>
          <option value="4">4名</option>
          <option value="5">5名</option>
          <option value="6">6名以上</option>
        </select>
      </div>
    </div>
    <div style="text-align: right;">
      <button onclick="closeEditModal()" style="margin-right: 10px;">キャンセル</button>
      <button onclick="submitEdit()" class="reserve-btn">変更を保存</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
let myReservations = [];
let currentEditReservation = null;

async function searchReservations() {
  const phone = document.getElementById("phoneSearch").value.trim();
  const resultArea = document.getElementById("resultArea");

  if (!phone) {
    alert("電話番号を入力してください");
    return;
  }

  resultArea.innerHTML = "<p>検索中...</p>";

  try {
    const res = await fetch(API_URL + `/api/mypage?phone=${encodeURIComponent(phone)}`);
    if (!res.ok) throw new Error("通信エラー");

    myReservations = await res.json();

    if (!myReservations || myReservations.length === 0) {
      resultArea.innerHTML = "<p>予約が見つかりませんでした。</p>";
      return;
    }

    renderReservations();
  } catch (error) {
    console.error(error);
    resultArea.innerHTML = "<p>予約の取得に失敗しました。</p>";
  }
}

function renderReservations() {
  const resultArea = document.getElementById("resultArea");
  resultArea.innerHTML = "";

  myReservations.forEach(res => {
    const card = document.createElement("div");
    card.className = "reservation-card";

    card.innerHTML = `
      <p><strong>予約番号：</strong>${res.reservationNo}</p>
      <p><strong>利用日：</strong>${res.useDate}</p>
      <p><strong>人数：</strong>${res.people}名</p>
      <p><strong>合計金額：</strong>¥${Number(res.totalPrice || 0).toLocaleString()}</p>
      <button class="edit-btn" onclick="openEditModal('${res.reservationNo}')">変更する</button>
      <button class="cancel-btn" onclick="cancelReservation('${res.reservationNo}')">キャンセルする</button>
    `;

    resultArea.appendChild(card);
  });
}

// 変更モーダルを開く
function openEditModal(reservationNo) {
  currentEditReservation = myReservations.find(r => r.reservationNo === reservationNo);
  if (!currentEditReservation) return;

  document.getElementById("editDate").value = currentEditReservation.useDate;
  document.getElementById("editPeople").value = currentEditReservation.people;
  document.getElementById("editModal").style.display = "flex";
}

function closeEditModal() {
  document.getElementById("editModal").style.display = "none";
  currentEditReservation = null;
}

// 変更内容を送信
async function submitEdit() {
  if (!currentEditReservation) return;

  const newDate = document.getElementById("editDate").value;
  const newPeople = Number(document.getElementById("editPeople").value);

  if (!newDate) {
    alert("利用日を選択してください");
    return;
  }

  try {
    const res = await fetch(API_URL + `/api/reservation/${currentEditReservation.reservationNo}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        useDate: newDate,
        people: newPeople
      })
    });

    if (!res.ok) throw new Error("通信エラー");

    const data = await res.json();
    if (data.success) {
      alert("予約を変更しました");
      closeEditModal();
      searchReservations(); // 再読み込み
    } else {
      alert(data.message || "変更に失敗しました");
    }
  } catch (error) {
    console.error(error);
    alert("通信エラーが発生しました");
  }
}

async function cancelReservation(reservationNo) {
  if (!confirm("本当にキャンセルしますか？")) return;

  try {
    const res = await fetch(API_URL + `/api/reservation/${reservationNo}`, {
      method: "DELETE"
    });

    if (!res.ok) throw new Error("通信エラー");

    const data = await res.json();
    if (data.success) {
      alert("予約をキャンセルしました");
      searchReservations();
    } else {
      alert(data.message || "キャンセルに失敗しました");
    }
  } catch (error) {
    console.error(error);
    alert("通信エラーが発生しました");
  }
}
</script>

</body>
</html>
