<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約ページ</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* カレンダー全体 */
    #calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      max-width: 100%;
    }

    /* カレンダーの日付セル */
    .calendar-day {
      aspect-ratio: 1 / 1;
      min-height: 42px;
      max-height: 48px;
      border: 1px solid #ddd;
      background-color: white;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.1s ease;
    }

    /* 空きあり */
    .calendar-day.available {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .calendar-day.available:hover {
      background-color: #c3e6cb;
    }

    /* 残りわずか */
    .calendar-day.few {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }

    /* 選択不可・過去日 */
    .calendar-day.disabled {
      background-color: #e9ecef;
      color: #6c757d;
      cursor: not-allowed;
    }

    /* 選択中 */
    .calendar-day.selected {
      background-color: #007bff !important;
      color: white !important;
      border: 1px solid #0056b3;
    }

    /* 選択日表示 */
    .selected-date {
      margin-top: 12px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>予約</h1>
  </div>
</header>

<main>
  <!-- カレンダー -->
  <section class="reservation-section">
    <h2>ご利用日を選択 <span class="required">*</span></h2>
    <div class="calendar-header">
      <button type="button" id="prevMonth">←</button>
      <h3 id="calendarTitle"></h3>
      <button type="button" id="nextMonth">→</button>
    </div>
    <div id="calendar" class="calendar"></div>
    <input type="hidden" id="useDate">
    <div id="selectedDateText" class="selected-date">利用日を選択してください</div>
  </section>

  <!-- 予約情報 -->
  <section class="reservation-section">
    <h2>予約情報</h2>

    <div class="form-group">
      <label for="company">会社名</label>
      <input type="text" id="company" placeholder="会社名（任意）">
    </div>

    <div class="form-group">
      <label for="name">お名前 <span class="required">*</span></label>
      <input type="text" id="name" required placeholder="山田 太郎">
    </div>

    <div class="form-group">
      <label for="phone">電話番号 <span class="required">*</span></label>
      <input type="tel" id="phone" required placeholder="090-1234-5678">
    </div>

    <div class="form-group">
      <label for="mail">メールアドレス</label>
      <input type="email" id="mail" placeholder="example@email.com">
    </div>

    <div class="form-group">
      <label>大人人数 <span class="required">*</span></label>
      <div class="people-control">
        <button type="button" id="minusPeople">−</button>
        <span id="peopleDisplay">1</span>
        <span>名</span>
        <button type="button" id="plusPeople">＋</button>
      </div>
      <input type="hidden" id="people" value="1">
    </div>

    <div class="form-group">
      <label for="memo">備考</label>
      <textarea id="memo" rows="4" placeholder="その他ご要望など（任意）"></textarea>
    </div>
  </section>

  <!-- 料金表示 -->
  <section class="reservation-section">
    <h2>合計金額</h2>
    <div id="totalPrice" class="total-price">人数を選択してください</div>
  </section>

  <!-- 予約ボタン -->
  <section class="reservation-section">
    <button id="reserveButton" class="reserve-btn large">予約を確定する</button>
  </section>

</main>

<script src="js/config.js"></script>
<script src="js/reservation.js"></script>
</body>
</html>
