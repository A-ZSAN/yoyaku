<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>温泉施設</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* 簡易予約フォーム */
    .quick-reserve {
      background-color: #fff;
      padding: 24px;
      margin: 24px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .quick-form {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
    }

    .form-item {
      flex: 1;
      min-width: 160px;
    }

    .form-item label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-item input,
    .form-item select {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    /* カレンダーモーダル */
    .calendar-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .calendar-modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 360px;
      width: 95%;
    }

    .calendar-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .calendar-modal #modalCalendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .calendar-modal .calendar-day {
      aspect-ratio: 1 / 1;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .calendar-modal .calendar-day.available {
      background-color: #d4edda;
      cursor: pointer;
    }

    .calendar-modal .calendar-day.disabled {
      background-color: #e9ecef;
      color: #999;
      cursor: not-allowed;
    }

    .calendar-modal .calendar-day.selected {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1 id="facilityName">温泉施設</h1>
  </div>
</header>

<main>
  <section class="hero">
    <img id="heroImage" src="img/hero-placeholder.jpg" alt="施設画像">
  </section>

  <!-- 簡易予約フォーム -->
  <section class="quick-reserve">
    <h2>ご予約</h2>
    <form action="reservation.html" method="get">
      <div class="quick-form">
        <div class="form-item">
          <label>利用日</label>
          <button type="button" id="openCalendarBtn" class="reserve-btn" style="width:100%; padding:10px; font-size:1rem;">
            日付を選択
          </button>
          <input type="hidden" id="date" name="date" required>
          <div id="selectedDateDisplay" style="margin-top:6px; font-size:0.9rem; color:#555;"></div>
        </div>

        <div class="form-item">
          <label for="people">人数</label>
          <select id="people" name="people" required>
            <option value="1">1名</option>
            <option value="2" selected>2名</option>
            <option value="3">3名</option>
            <option value="4">4名</option>
            <option value="5">5名</option>
            <option value="6">6名以上</option>
          </select>
        </div>

        <div class="form-item button-item">
          <button type="submit" class="reserve-btn">予約する</button>
        </div>
      </div>
    </form>
  </section>

  <!-- 以下省略（施設紹介・お知らせ・料金） -->
  <section>
    <h2>施設紹介</h2>
    <p id="description">読み込み中...</p>
  </section>

  <section>
    <h2>お知らせ</h2>
    <div id="news">読み込み中...</div>
  </section>

  <section>
    <h2>基本料金</h2>
    <div id="prices">読み込み中...</div>
  </section>

</main>

<footer>
  <p>© 温泉施設</p>
</footer>

<!-- カレンダーモーダル -->
<div id="calendarModal" class="calendar-modal">
  <div class="calendar-modal-content">
    <div class="calendar-modal-header">
      <h3>利用日を選択</h3>
      <button type="button" id="closeModalBtn">×</button>
    </div>
    <div id="modalCalendar"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>

<script>
// トップページ用：モーダルカレンダー処理
let reservedDates = [];

async function loadReservedDates() {
  try {
    const res = await fetch(API_URL + "/api/calendar");
    const data = await res.json();
    reservedDates = data.filter(d => !d.available).map(d => d.date);
  } catch (e) {
    console.error("カレンダー取得失敗", e);
  }
}

function openCalendarModal() {
  const modal = document.getElementById("calendarModal");
  const calendarArea = document.getElementById("modalCalendar");
  calendarArea.innerHTML = "";

  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();

  // 簡易的に今月のカレンダーを表示
  const firstDay = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();

  // 曜日ヘッダー
  const week = ["日","月","火","水","木","金","土"];
  week.forEach(w => {
    const div = document.createElement("div");
    div.textContent = w;
    div.style.textAlign = "center";
    div.style.fontWeight = "bold";
    calendarArea.appendChild(div);
  });

  // 空白
  for (let i = 0; i < firstDay; i++) {
    calendarArea.appendChild(document.createElement("div"));
  }

  // 日付
  for (let d = 1; d <= lastDate; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const btn = document.createElement("button");
    btn.textContent = d;
    btn.style.width = "100%";
    btn.style.aspectRatio = "1 / 1";

    if (reservedDates.includes(dateStr)) {
      btn.style.backgroundColor = "#e9ecef";
      btn.style.color = "#999";
      btn.disabled = true;
    } else {
      btn.onclick = () => {
        document.getElementById("date").value = dateStr;
        document.getElementById("selectedDateDisplay").textContent = `選択日：${dateStr}`;
        modal.style.display = "none";
      };
    }
    calendarArea.appendChild(btn);
  }

  modal.style.display = "flex";
}

document.getElementById("openCalendarBtn").addEventListener("click", openCalendarModal);
document.getElementById("closeModalBtn").addEventListener("click", () => {
  document.getElementById("calendarModal").style.display = "none";
});

// 初期化
loadReservedDates();
</script>

</body>
</html>
