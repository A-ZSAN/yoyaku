<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
予約ページ
</title>


<link
rel="stylesheet"
href="css/style.css"
>


</head>


<body>


<header>

<div class="header-inner">

<h1>
予約
</h1>

</div>

</header>



<main>


<section>


<h2>
ご利用日を選択
</h2>


<div class="calendar-header">

  <button
    id="prevMonth"
    type="button"
  >
    ←
  </button>


  <h3
    id="calendarTitle"
  >
  </h3>


  <button
    id="nextMonth"
    type="button"
  >
    →
  </button>

</div>


<div
  id="calendar"
  class="calendar"
>
</div>


<input
type="hidden"
id="useDate"
>

<div id="selectedDateText">

利用日を選択してください

</div>

</section>



<section>


<h2>
予約情報
</h2>


<label>

会社名

<input
type="text"
id="company"
>

</label>



<label>

お名前

<input
type="text"
id="name"
required
>

</label>



<label>

電話番号

<input
type="tel"
id="phone"
required
>

</label>



<label>

メールアドレス

<input
type="email"
id="mail"
>

</label>



<label>

大人人数

<div class="people-control">


<button
type="button"
id="minusPeople"
>
−
</button>


<span
id="peopleDisplay"
>
1
</span>

名


<button
type="button"
id="plusPeople"
>
＋
</button>


</div>


<input
type="hidden"
id="people"
value="1"
>


</label>



<label>

備考

<textarea
id="memo"
></textarea>

</label>


</section>



<section>


<h2>
料金
</h2>


<div id="totalPrice">

人数を選択してください

</div>


</section>



<section>


<button
id="reserveButton"
>

予約する

</button>


</section>



</main>



<script src="js/config.js"></script>

<script src="js/reservation.js"></script>


</body>

</html>
