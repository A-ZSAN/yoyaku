<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>温泉予約システム</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- =========================
ヘッダー
========================= -->

<header>

    <div class="container header-inner">

        <div class="logo-area">

            <img
                id="logoImage"
                class="logo"
                src="images/logo.png"
                alt="ロゴ">

            <div>

                <h1 id="facilityName">
                    ○○温泉
                </h1>

                <p id="subTitle">
                    心ほどける癒しの時間
                </p>

            </div>

        </div>

    </div>

</header>

<!-- =========================
メイン画像
========================= -->

<section class="hero">

    <img
        id="heroImage"
        src="images/main.jpg"
        alt="温泉">

    <div class="hero-overlay">

        <h2 id="heroTitle">

            ○○温泉

        </h2>

        <p id="heroMessage">

            ゆったりと流れる時間を
            お楽しみください

        </p>

        <a
            href="reserve.html"
            class="reserve-btn">

            予約する

        </a>

    </div>

</section>

<!-- =========================
施設紹介
========================= -->

<section class="section">

    <div class="container">

        <h2>

            施設紹介

        </h2>

        <p
            id="facilityDescription">

            四季折々の自然に囲まれた
            癒しの温泉施設です。

        </p>

    </div>

</section>

<!-- =========================
お知らせ
========================= -->

<section class="section news-section">

    <div class="container">

        <h2>

            お知らせ

        </h2>

        <div
            id="newsList">

            <div class="news-card">

                読み込み中...

            </div>

        </div>

    </div>

</section>

<!-- =========================
基本料金
========================= -->

<section class="section">

    <div class="container">

        <h2>

            基本料金

        </h2>

        <table class="price-table">

            <thead>

                <tr>

                    <th>

                        区分

                    </th>

                    <th>

                        料金

                    </th>

                </tr>

            </thead>

            <tbody
                id="priceTable">

                <tr>

                    <td>

                        大人

                    </td>

                    <td>

                        ￥0

                    </td>

                </tr>

                <tr>

                    <td>

                        子供

                    </td>

                    <td>

                        ￥0

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</section>

<!-- =========================
予約ボタン
========================= -->

<section class="section center">

    <a
        href="reserve.html"
        class="reserve-btn large">

        ご予約はこちら

    </a>

</section>

<!-- =========================
フッター
========================= -->

<footer>

    <div class="container">

        <h3
            id="footerFacility">

            ○○温泉

        </h3>

        <p
            id="footerAddress">

            住所

        </p>

        <p
            id="footerPhone">

            TEL

        </p>

        <p>

            © 2026 Onsen Reservation System

        </p>

    </div>

</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>

</body>

</html>
