<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
予約完了
</title>

<link
rel="stylesheet"
href="css/style.css"
>

</head>


<body>


<header>

<div class="header-inner">

<h1>
予約完了
</h1>

</div>

</header>



<main>


<section>

<h2>
ご予約ありがとうございます
</h2>


<div id="completeMessage">

</div>


</section>


<section>

<a href="index.html">

トップへ戻る

</a>


</section>


</main>



<script>

const data =

JSON.parse(

localStorage.getItem(
"reservationResult"
)

);



if(data){


document

.getElementById(
"completeMessage"
)

.innerHTML = `

<p>
予約番号：
${data.reservationNo}
</p>

<p>
利用日：
${data.useDate}
</p>


<p>
人数：
${data.people}名
</p>


<p>
合計金額：
${Number(data.totalPrice).toLocaleString()}円
</p>

`;


}


</script>


</body>

</html>
