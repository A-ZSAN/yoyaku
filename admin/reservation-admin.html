<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
予約管理
</title>

<link
rel="stylesheet"
href="../css/style.css"
>

</head>


<body>


<header>

<div class="header-inner">

<h1>
予約管理
</h1>

</div>

</header>


<main>


<section>


<div class="calendar-header">


<button
id="prevMonth"
type="button"
>
←
</button>


<h2
id="calendarTitle"
>
</h2>


<button
id="nextMonth"
type="button"
>
→
</button>


</div>



<div
id="reservationCalendar"
class="calendar"
>

読み込み中...

</div>


</section>



<section>


<h2>
予約状況
</h2>


<div
id="reservationInfo"
>

日付を選択してください

</div>


</section>

<div id="reservationModal" class="modal" style="display:none;">

  <div class="modal-content">

    <span id="closeModal" class="modal-close">&times;</span>

    <div id="modalBody"></div>

  </div>

</div>

</main>



<script src="../js/config.js"></script>

<script src="../js/reservation-admin.js"></script>


</body>

</html>
