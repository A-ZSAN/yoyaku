<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約管理</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .search-bar {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .search-bar input {
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      flex: 1;
      min-width: 200px;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    .admin-table th,
    .admin-table td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
    }
    .admin-table th {
      background-color: #2c3e50;
      color: white;
    }
    .cancel-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 12px;
      max-width: 500px;
      width: 90%;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>予約管理</h1>
  </div>
</header>

<main>
  <section class="reservation-section">
    <h2>予約一覧</h2>

    <!-- 検索バー -->
    <div class="search-bar">
      <input type="text" id="searchKeyword" placeholder="名前・電話番号で検索">
      <input type="date" id="searchDate">
      <button onclick="filterReservations()">検索</button>
      <button onclick="resetFilter()">リセット</button>
    </div>

    <div id="loading">読み込み中...</div>

    <table class="admin-table" id="reservationTable" style="display: none;">
      <thead>
        <tr>
          <th>予約番号</th>
          <th>利用日</th>
          <th>名前</th>
          <th>人数</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="reservationList"></tbody>
    </table>
  </section>
</main>

<!-- 詳細モーダル -->
<div id="detailModal" class="modal">
  <div class="modal-content">
    <h3>予約詳細</h3>
    <div id="modalContent"></div>
    <div style="margin-top: 20px; text-align: right;">
      <button onclick="closeModal()" style="margin-right: 10px;">閉じる</button>
      <button id="cancelBtn" class="cancel-btn">予約をキャンセルする</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
let allReservations = [];
let filteredReservations = [];

async function loadReservations() {
  const loading = document.getElementById("loading");
  const table = document.getElementById("reservationTable");

  try {
    const res = await fetch(API_URL + "/api/reservations");
    if (!res.ok) throw new Error("通信エラー");

    allReservations = await res.json();
    filteredReservations = [...allReservations];

    if (allReservations.length === 0) {
      loading.textContent = "予約がありません";
      return;
    }

    loading.style.display = "none";
    table.style.display = "table";

    renderTable(filteredReservations);
  } catch (error) {
    console.error(error);
    loading.textContent = "予約情報の取得に失敗しました";
  }
}

function renderTable(list) {
  const tbody = document.getElementById("reservationList");
  tbody.innerHTML = "";

  list.forEach(res => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${res.reservationNo}</td>
      <td>${res.useDate}</td>
      <td>${res.name}</td>
      <td>${res.people}名</td>
      <td>
        <button onclick="showDetail('${res.reservationNo}')">詳細</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function filterReservations() {
  const keyword = document.getElementById("searchKeyword").value.toLowerCase().trim();
  const date = document.getElementById("searchDate").value;

  filteredReservations = allReservations.filter(r => {
    const matchKeyword = 
      r.name.toLowerCase().includes(keyword) || 
      (r.phone && r.phone.includes(keyword));
    const matchDate = !date || r.useDate === date;

    return matchKeyword && matchDate;
  });

  renderTable(filteredReservations);
}

function resetFilter() {
  document.getElementById("searchKeyword").value = "";
  document.getElementById("searchDate").value = "";
  filteredReservations = [...allReservations];
  renderTable(filteredReservations);
}

function showDetail(reservationNo) {
  const reservation = allReservations.find(r => r.reservationNo === reservationNo);
  if (!reservation) return;

  const content = document.getElementById("modalContent");
  content.innerHTML = `
    <p><strong>予約番号：</strong>${reservation.reservationNo}</p>
    <p><strong>利用日：</strong>${reservation.useDate}</p>
    <p><strong>会社名：</strong>${reservation.company || "-"}</p>
    <p><strong>お名前：</strong>${reservation.name}</p>
    <p><strong>電話番号：</strong>${reservation.phone}</p>
    <p><strong>メール：</strong>${reservation.mail || "-"}</p>
    <p><strong>人数：</strong>${reservation.people}名</p>
    <p><strong>備考：</strong>${reservation.memo || "-"}</p>
    <p><strong>合計金額：</strong>¥${Number(reservation.totalPrice || 0).toLocaleString()}</p>
  `;

  document.getElementById("cancelBtn").onclick = () => cancelReservation(reservationNo);
  document.getElementById("detailModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("detailModal").style.display = "none";
}

async function cancelReservation(reservationNo) {
  if (!confirm("本当にこの予約をキャンセルしますか？")) return;

  try {
    const res = await fetch(API_URL + `/api/reservation/${reservationNo}`, {
      method: "DELETE"
    });

    if (!res.ok) throw new Error("通信エラー");

    const data = await res.json();
    if (data.success) {
      alert("予約をキャンセルしました");
      closeModal();
      location.reload();
    } else {
      alert(data.message || "キャンセルに失敗しました");
    }
  } catch (error) {
    console.error(error);
    alert("通信エラーが発生しました");
  }
}

document.addEventListener("DOMContentLoaded", () => {
  loadReservations();
});
</script>

</body>
</html>
